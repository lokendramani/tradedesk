info:
  name: Get Folio Grouped Holdings
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/api/wealth/holdings/"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  params:
    - name: group_by
      value: folio
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
