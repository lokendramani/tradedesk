info:
  name: Get Holdings
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/wealth/holdings/"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
